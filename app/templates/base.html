<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Assistente RSL{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Assistente RSL</h1>
            <div class="space-x-4">
                <a href="/dashboard/{{ projeto.id if projeto else '' }}" class="hover:text-blue-300">Dashboard</a>
                <a href="/protocolo/{{ projeto.id if projeto else '' }}" class="hover:text-blue-300">Protocolo</a>
                <a href="{{ '/artigos/' ~ projeto.id if projeto else '/artigos' }}" class="hover:text-blue-300">Artigos</a>
                <a href="/triagem/{{ projeto.id if projeto else '' }}" class="hover:text-blue-300">Triagem</a>
                <a href="{{ '/artigos/' ~ projeto.id ~ '#adicionar-artigo' if projeto else '/artigos' }}" class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded font-semibold">+ Adicionar artigo</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
